name: Release

# Push a tag matching pluginVersion in gradle.properties, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Needs the repository secrets CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD and PUBLISH_TOKEN (see README).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Tag matches pluginVersion
        run: |
          version=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pluginVersion=$version"; exit 1
          fi
      - name: Test
        run: ./gradlew test --console=plain
      - name: Sign and publish to JetBrains Marketplace
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --console=plain
      - name: GitHub release with the signed zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew getChangelog --project-version="${GITHUB_REF_NAME#v}" --no-header --console=plain -q > release-notes.md
          gh release create "$GITHUB_REF_NAME" build/distributions/*-signed.zip \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
