name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      verify:
        description: Run the JetBrains Plugin Verifier (downloads several IDEs)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew test buildPlugin --console=plain
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests
      - name: Plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip

  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Free disk space for the IDE downloads
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Plugin Verifier
        run: ./gradlew verifyPlugin --console=plain
      - name: Verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifier-report
          path: build/reports/pluginVerifier
