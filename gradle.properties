pluginVersion=0.1.1
# Optional path of a locally installed IntelliJ IDEA to build and test against, which avoids the download.
# Leave empty here and set it per machine instead, e.g. in ~/.gradle/gradle.properties or with -PplatformLocalPath=...
# When empty, platformType/platformVersion below are downloaded.
platformLocalPath=
platformType=IU
platformVersion=2026.2
# PhpStorm versions checked by verifyPlugin (comma separated). To run the tests inside PhpStorm instead of IDEA:
#   ./gradlew test -PplatformLocalPath= -PplatformType=PS
verifyPhpStormVersions=2024.3,2026.2,2026.3
# IntelliJ IDEA Ultimate versions checked by verifyPlugin (comma separated), plus platformLocalPath if set.
verifyIdeaVersions=2024.3,2026.2,2026.3
org.gradle.jvmargs=-Xmx2g
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false
